<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for Niranjan</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0e17;
            --gold: #d4af37;
            --rose: #e1306c;
            --glass: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Starry Background Effect */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            opacity: 0.5;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }

        /* Hero Section */
        header {
            margin-top: 10vh;
            margin-bottom: 50px;
            animation: fadeIn 2s ease-in;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: var(--gold);
            margin-bottom: 10px;
            font-style: italic;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Memory Cards (Arguments) */
        .journey {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 60px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            transition: transform 0.4s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.12);
        }

        .card-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--rose);
            margin-bottom: 15px;
        }

        /* The Final Proposal Card */
        .proposal-card {
            border: 2px solid var(--gold);
            padding: 60px 30px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .btn-yes {
            background: var(--gold);
            color: black;
        }

        .btn-no {
            background: transparent;
            color: white;
            border: 1px solid white;
        }

        /* Mobile Specific Adjustments */
        @media (max-width: 600px) {
            .btn-group { flex-direction: column; }
            .glass-card { padding: 20px; }
            header { margin-top: 5vh; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1>To Niranjan</h1>
            <p class="subtitle">Our Celestial Journey</p>
        </header>

        <div class="journey">
            <div class="glass-card">
                <p class="card-title">Where it began</p>
                <p>Since 2022</p>
            </div>

            <div class="glass-card">
                <p class="card-title">My favorite memory</p>
                <p>The First Date</p>
            </div>
        </div>

        <div class="glass-card proposal-card" id="proposal">
            <h2 style="font-family: 'Playfair Display'; margin-bottom: 20px;">I Love You</h2>
            <div class="btn-group">
                <button class="btn btn-yes" onclick="celebrate()">Yes, Always</button>
                <button class="btn btn-no" id="no-btn" onmouseover="moveNo()">Not Today</button>
            </div>
        </div>

        <div id="success" style="display:none; text-align:center; padding: 50px;">
            <h1 style="color: var(--rose);">Forever with You! 💖</h1>
            <p>Every star in the sky is shining for us tonight.</p>
        </div>
    </div>

    <script>
        function moveNo() {
            const btn = document.getElementById('no-btn');
            btn.style.position = 'fixed';
            btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            btn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        }

        function celebrate() {
            document.getElementById('proposal').style.display = 'none';
            document.querySelector('.journey').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.body.style.background = "radial-gradient(circle at center, #4b1248 0%, #000 100%)";
        }
    </script>
</body>
</html>
