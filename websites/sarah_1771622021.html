<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter for Sarah</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d3436;
            --accent: #d63031;
            --gold: #b8860b;
            --soft-white: #f9f9f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a1a;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* The Envelope/Letter Container */
        .envelope {
            width: 100%;
            max-width: 600px;
            background: var(--soft-white);
            padding: 60px 40px;
            border-radius: 2px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: translateY(30px);
            opacity: 0;
            animation: unfold 1.5s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        @keyframes unfold {
            to { transform: translateY(0); opacity: 1; }
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 8px;
            background: linear-gradient(90deg, var(--gold), #f1c40f, var(--gold));
        }

        /* Typography */
        .header-box {
            border-bottom: 1px solid #ddd;
            margin-bottom: 40px;
            padding-bottom: 20px;
            text-align: center;
        }

        .dear {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            color: var(--primary);
            letter-spacing: -1px;
        }

        .content-body {
            line-height: 1.8;
            color: #444;
            font-size: 1.1rem;
            margin-bottom: 40px;
            text-align: justify;
        }

        .highlight-text {
            color: var(--primary);
            font-weight: 600;
            display: block;
            margin-top: 20px;
            font-style: italic;
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }

        /* Interactive Buttons */
        .action-area {
            text-align: center;
            border-top: 1px solid #ddd;
            padding-top: 40px;
        }

        .question {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: 25px;
            color: var(--primary);
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 35px;
            border-radius: 0;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .btn-yes {
            background: var(--accent);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
        }

        .btn-yes:hover {
            background: #b32627;
            transform: scale(1.05);
        }

        .btn-no {
            background: transparent;
            color: #777;
            border: 1px solid #ccc;
        }

        /* Success State */
        #success-state {
            display: none;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .envelope { padding: 40px 20px; }
            .btn-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="envelope" id="main-card">
        <div id="letter-content">
            <div class="header-box">
                <p class="dear">Dearest Sarah,</p>
                <h1>A Letter of Intent</h1>
            </div>

            <div class="content-body">
                <p>We've shared so many laughs this year.</p>
                <span class="highlight-text">"You are my favorite person."</span>
            </div>

            <div class="action-area">
                <p class="question">Will you be my Valentine?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" onclick="showSuccess()">Accept 🌹</button>
                    <button class="btn btn-no" id="noBtn" onmouseover="dodge()">Decline</button>
                </div>
            </div>
        </div>

        <div id="success-state">
            <h2 class="dear" style="font-size: 3.5rem;">Accepted.</h2>
            <p style="color: #444; margin-top: 20px;">The stars have aligned. See you soon. 💖</p>
        </div>
    </div>

    <script>
        function dodge() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function showSuccess() {
            document.getElementById('letter-content').style.display = 'none';
            document.getElementById('success-state').style.display = 'block';
            document.getElementById('main-card').style.borderColor = '#b8860b';
        }
    </script>
</body>
</html>
