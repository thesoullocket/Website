<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wish - Sarah</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --wax-color: #ff6b81;
            --flame-outer: #ffda00;
            --flame-inner: #fff;
            --smoke-color: rgba(255, 255, 255, 0.4);
        }

        * { margin:0; padding:0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #030303;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CINEMATIC BOKEH BACKGROUND --- */
        .ambient-layer {
            position: fixed; inset: 0;
            background: url('https://images.unsplash.com/photo-1513151233558-d860c5398176?w=1200&q=80'); 
            background-size: cover;
            background-position: center;
            filter: blur(40px) brightness(0.12);
            opacity: 0.9;
            z-index: 1;
            transition: all 2s ease;
        }

        /* --- THE MASTER CANDLE (REALISTIC) --- */
        .ceremony-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transform: scale(clamp(0.8, 20vw, 1));
        }

        /* The Surface Reflection */
        .surface-reflection {
            position: absolute;
            bottom: -20px;
            width: clamp(200px, 60vw, 300px); height: 60px;
            background: radial-gradient(ellipse at center, rgba(255, 218, 0, 0.08) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(10px);
            z-index: 5;
            pointer-events: none;
        }

        /* High-Fidelity Wax Candle */
        .wax-candle {
            width: 58px; height: 180px;
            background: linear-gradient(90deg, #993b48 0%, #e37e90 45%, #ff8a9a 50%, #e37e90 55%, #993b48 100%);
            border-radius: 10px 10px 4px 4px;
            position: relative;
            box-shadow: 
                inset 10px 0 30px rgba(0,0,0,0.1),
                inset -10px 0 30px rgba(0,0,0,0.1),
                0 15px 60px rgba(0,0,0,0.9);
            overflow: visible;
        }
        
        @media (max-height: 500px) {
            .wax-candle { height: 130px; }
            .ceremony-wrap { margin-top: 50px; }
        }

        .wax-candle::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 15px;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, rgba(227, 126, 144, 0) 100%);
            border-radius: 10px 10px 0 0;
            opacity: 0.8;
        }

        .wick {
            width: 5px; height: 18px;
            background: #0d0d0d;
            position: absolute;
            top: -18px; left: 50%;
            transform: translateX(-50%);
            border-radius: 3px 3px 0 0;
            background: linear-gradient(to bottom, #000 0%, #222 100%);
            z-index: 11;
        }

        .flame-anchor {
            position: absolute;
            top: -70px; left: 50%;
            transform: translateX(-50%);
            filter: blur(0.5px);
            animation: slow-sway 4s infinite ease-in-out;
        }

        .flame-outer {
            width: 24px; height: 50px;
            background: linear-gradient(to bottom, #fff 10%, #ffda00 40%, #ff8c00 80%, rgba(255, 69, 0, 0) 100%);
            border-radius: 50% 50% 35% 35%;
            filter: drop-shadow(0 0 20px #ffda00) drop-shadow(0 0 45px #ff8c00);
            position: relative;
        }
        .flame-inner-core {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 8px; height: 16px;
            background: #2a6df2; 
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(1.5px);
        }

        .glow-aura {
            position: absolute; top: -60px;
            width: clamp(300px, 80vw, 400px); height: clamp(300px, 80vw, 400px);
            background: radial-gradient(circle, rgba(255, 218, 0, 0.15) 0%, rgba(255, 218, 0, 0) 70%);
            pointer-events: none;
            mix-blend-mode: soft-light;
            animation: flicker 0.1s infinite alternate;
        }

        @keyframes slow-sway {
            0%, 100% { transform: translateX(-50%) rotate(-1deg) scale(1); }
            50% { transform: translateX(-52%) rotate(1deg) scale(1.05); }
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .smoke-particle {
            position: absolute;
            width: 10px; height: 10px;
            background: white;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0;
            pointer-events: none;
        }

        .hint-ceremony {
            margin-top: clamp(40px, 10vh, 80px);
            font-size: clamp(0.6rem, 2.5vw, 0.8rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            text-align: center;
        }

        #reveal-container {
            position: fixed; inset: 0;
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 1000;
        }

        .magic-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: clamp(30px, 8vw, 60px) 25px clamp(30px, 8vw, 50px);
            border-radius: clamp(20px, 5vw, 40px);
            max-width: 420px; width: 95%;
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            animation: float-card 5s infinite ease-in-out;
            margin-top: 40px; 
        }

        @keyframes float-card {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .birthday-photo {
            width: clamp(160px, 45vw, 220px); height: clamp(160px, 45vw, 220px);
            border-radius: 50%;
            object-fit: cover;
            border: clamp(5px, 1.5vw, 8px) solid white;
            box-shadow: 0 0 50px rgba(255,255,255,0.25);
            margin: -110px auto 25px;
            transform: scale(0.5);
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .h-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 3.2rem);
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #ffffff 0%, #ffda00 100%);
            background-clip: text; /* standard property */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .p-wish {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.2rem, 4.5vw, 1.8rem);
            color: rgba(255,255,255,0.85);
            max-width: 320px; margin: 0 auto;
        }

        .btn-restart {
            margin-top: 35px;
            background: transparent;
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }

        @media (max-width: 400px) {
            .magic-card { padding: 40px 15px 30px; }
            .h-name { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-layer" id="bg-blend"></div>

    <div class="ceremony-wrap" id="candle-ui" onclick="extinguishCeremony()">
        <div class="glow-aura" id="aura"></div>
        <div class="surface-reflection" id="floor-glow"></div>
        <div class="wax-candle">
            <div class="wick"></div>
            <div class="flame-anchor" id="flame-root">
                <div class="flame-outer">
                    <div class="flame-inner-core"></div>
                </div>
            </div>
        </div>
        <p class="hint-ceremony" id="prompt">Tap the flame to make a wish</p>
    </div>

    <div id="reveal-container">
        <div class="magic-card">
            <img src="https://i.pinimg.com/736x/d1/d7/2d/d1d72d854b2f8c33da8fb2337fd7aef2.jpg" class="birthday-photo" id="photo-v">
            <h1 class="h-name">Happy Birthday Sarah!</h1>
            <p class="p-wish">May your year ahead be as magical as this wish! 🎂✨</p>
            <button class="btn-restart" onclick="location.reload()">Replay Ceremony</button>
        </div>
    </div>

    <script>
        // High-Quality Audio Soundscapes
        const blowSound = new Audio('https://cdn.pixabay.com/audio/2022/03/10/audio_510a726330.mp3'); 
        const celebrateSound = new Audio('https://cdn.pixabay.com/audio/2021/08/04/audio_3d1a6c4b92.mp3');

        let currentSlide = 0; // for external usage if needed
        function extinguishCeremony() {
            // Trigger Audio on tap
            blowSound.play().catch(e => console.log('Audio wait: ' + e));

            document.getElementById('flame-root').style.display = 'none';
            document.getElementById('aura').style.display = 'none';
            document.getElementById('floor-glow').style.display = 'none';
            document.getElementById('prompt').style.opacity = '0';
            document.getElementById('bg-blend').style.opacity = '0';
            document.body.style.background = '#000';

            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'smoke-particle';
                    particle.style.left = (window.innerWidth / 2 - 5 + (Math.random() * 10)) + 'px';
                    particle.style.top = (window.innerHeight / 2 - 100) + 'px';
                    document.body.appendChild(particle);

                    particle.animate([
                        { transform: `translate(0, 0) scale(1)`, opacity: 0.6, filter: 'blur(5px)' },
                        { transform: `translate(${(Math.random()-0.5)*100}px, -200px) scale(8)`, opacity: 0, filter: 'blur(15px)' }
                    ], {
                        duration: 1500 + Math.random()*1000,
                        easing: 'ease-out'
                    }).onfinish = () => particle.remove();
                }, i * 80);
            }

            setTimeout(() => {
                // Trigger Celebration Audio
                celebrateSound.play().catch(e => console.log('Audio wait: ' + e));

                const duration = 3 * 1000;
                const end = Date.now() + duration;

                (function frame() {
                    confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffda00', '#fff', '#ff6b81'] });
                    confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffda00', '#fff', '#ff6b81'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());

                document.getElementById('candle-ui').style.display = 'none';
                const reveal = document.getElementById('reveal-container');
                reveal.style.display = 'flex';
                
                setTimeout(() => {
                    reveal.style.opacity = '1';
                    document.getElementById('photo-v').style.transform = 'scale(1)';
                    document.getElementById('bg-blend').style.opacity = '1';
                    document.getElementById('bg-blend').style.filter = 'blur(10px) brightness(0.2)';
                }, 100);

            }, 1800);
        }
    </script>
</body>
</html>
