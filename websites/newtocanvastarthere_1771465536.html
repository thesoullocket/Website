<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    Ref: New to Canva? Start here  💖
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #c13584 0%, #e1306c 50%, #fd1d1d 100%);
            overflow: hidden;
            position: relative;
        }

        .hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            animation: float-up 8s infinite ease-in;
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.3));
        }

        .heart::before {
            content: '♥';
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) rotate(180deg) scale(1.2);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 600px;
            width: 90%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 70px 50px;
            box-shadow: 0 8px 32px rgba(232, 180, 208, 0.25),
                        0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: cardFloat 3s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 12px 40px rgba(232, 180, 208, 0.35),
                        0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 600;
            color: #c13584;
            margin-bottom: 16px;
            text-shadow: none;
            letter-spacing: -0.5px;
            animation: gentlePulse 3s ease-in-out infinite;
        }

        @keyframes gentlePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.03);
                opacity: 0.95;
            }
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.2rem, 4.5vw, 3.2rem);
            font-weight: 600;
            color: #c13584;
            margin-bottom: 60px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            animation: gentleSway 4s ease-in-out infinite;
        }

        @keyframes gentleSway {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(1deg);
            }
            75% {
                transform: rotate(-1deg);
            }
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            position: relative;
            min-height: 80px;
            margin-top: 10px;
            width: 100%;
        }

        .btn {
            padding: 16px 48px;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            font-weight: 500;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 12px rgba(193, 53, 132, 0.15);
            border: 1.5px solid transparent;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-yes {
            color: #fff;
            background: linear-gradient(135deg, #c13584 0%, #e1306c 50%, #fd1d1d 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(193, 53, 132, 0.3);
            z-index: 10; /* Keep Yes button on top */
        }

        .btn-yes::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-yes::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        .btn-yes:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-yes:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(193, 53, 132, 0.4);
        }

        .btn-no {
            color: #c13584;
            background: #fff;
            border: 1.5px solid #e1306c;
            transition: all 0.2s ease;
            position: relative;
            animation: borderGlow 3s ease-in-out infinite;
            z-index: 5;
        }

        .btn-no.escaping {
            position: fixed;
            animation: none;
        }

        @keyframes borderGlow {
            0%, 100% {
                box-shadow: 0 2px 12px rgba(193, 53, 132, 0.15);
            }
            50% {
                box-shadow: 0 2px 16px rgba(193, 53, 132, 0.3);
            }
        }

        .btn-no:hover {
            transform: translateY(-2px);
            background: #fff; /* Solid background to prevent transparency */
            box-shadow: 0 4px 16px rgba(193, 53, 132, 0.2);
        }

        .success-message {
            display: none;
            animation: zoomIn 0.8s ease;
        }

        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-message h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-family: 'Playfair Display', serif;
            animation: glow 2s infinite, successPulse 1s ease-out;
            margin-bottom: 30px;
            position: relative;
        }

        @keyframes successPulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .heart-wave {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .heart-wave span {
            font-size: clamp(2rem, 4vw, 3rem);
            display: inline-block;
            animation: jump 1.5s ease-in-out infinite;
        }

        .heart-wave span:nth-child(1) {
            animation-delay: 0s;
        }

        .heart-wave span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .heart-wave span:nth-child(3) {
            animation-delay: 0.2s;
        }

        .heart-wave span:nth-child(4) {
            animation-delay: 0.3s;
        }

        @keyframes jump {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.2);
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(193, 53, 132, 0.6),
                             0 0 30px rgba(225, 48, 108, 0.4);
            }
            50% {
                text-shadow: 0 0 30px rgba(193, 53, 132, 0.8),
                             0 0 50px rgba(225, 48, 108, 0.6);
            }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            animation: float-heart 3s ease-in-out infinite;
        }

        @keyframes float-heart {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 50px 30px;
            }

            .buttons-container {
                gap: 16px;
                min-height: 100px;
                flex-wrap: wrap;
            }

            .btn {
                padding: 14px 42px;
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 40px 25px;
            }
            
            .buttons-container {
                gap: 14px;
                flex-wrap: wrap;
            }

            .btn-no:not(.escaping) {
                position: static;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-background" id="heartsBackground"></div>
    <div class="floating-hearts" id="floatingHearts"></div>
    <canvas id="confetti"></canvas>

    <div class="container">
        <div class="glass-card">
            <div id="questionSection">
                <h1>Will You Be My Valentine?</h1>
                <h2>New to Canva? Start here ?</h2>
                <div class="buttons-container" id="buttonsContainer">
                    <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
                    <button class="btn btn-no" id="noBtn">No</button>
                </div>
            </div>
            <div class="success-message" id="successMessage">
                <h1>YAY! I Love You!</h1>
                <div class="heart-wave">
                    <span>💕</span>
                    <span>💗</span>
                    <span>💓</span>
                    <span>💝</span>
                    <span>💖</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Background floating hearts
        const heartsBackground = document.getElementById('heartsBackground');

        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.bottom = '-50px';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 20 + 18) + 'px';
            heartsBackground.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createBackgroundHeart, 400);

        // No button functionality
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const card = document.querySelector('.glass-card');

        const noTexts = [
            "Really? 🥺", "Are you sure? 💔", "Think again! 💭", "My heart will break 💔",
            "Pleaseee? 🥺", "Don't do this to me 😢", "Give love a chance 💖", "But... but... 🥹",
            "I'll be sad forever 😭", "One more chance? 💝", "Pretty please? 🌸",
            "You're breaking my heart 💔", "Reconsider? 🙏", "Think of the memories 🌹", "Just say yes! 💕"
        ];

        let noClickCount = 0;

        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            noBtn.classList.add('escaping');
            
            const cardRect = card.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            
            const padding = 20;
            const minX = cardRect.left + padding;
            const maxX = cardRect.right - btnRect.width - padding;
            const minY = cardRect.top + padding;
            const maxY = cardRect.bottom - btnRect.height - padding;

            let newX, newY;
            let overlap = true;

            // Try generating a position until it doesn't overlap the Yes button
            while (overlap) {
                newX = minX + Math.random() * (maxX - minX);
                newY = minY + Math.random() * (maxY - minY);

                // Define a "Danger Zone" around the Yes button
                const buffer = 30;
                const isOverlappingX = newX + btnRect.width + buffer > yesRect.left && newX - buffer < yesRect.right;
                const isOverlappingY = newY + btnRect.height + buffer > yesRect.top && newY - buffer < yesRect.bottom;

                if (!(isOverlappingX && isOverlappingY)) {
                    overlap = false;
                }
            }
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.textContent = noTexts[noClickCount % noTexts.length];
            noClickCount++;
        });

        // Yes button functionality
        yesBtn.addEventListener('click', () => {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            createConfetti();
            showFloatingHearts();
        });

        // Confetti effect
        function createConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#c13584', '#e1306c', '#fd1d1d', '#f77737', '#fcaf45'];

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height - canvas.height;
                    this.size = Math.random() * 8 + 5;
                    this.speedY = Math.random() * 3 + 2;
                    this.speedX = Math.random() * 2 - 1;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.rotation = Math.random() * 360;
                    this.rotationSpeed = Math.random() * 5 - 2.5;
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;
                    this.rotation += this.rotationSpeed;
                    if (this.y > canvas.height) {
                        this.y = -10;
                        this.x = Math.random() * canvas.width;
                    }
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                    ctx.restore();
                }
            }

            for (let i = 0; i < 200; i++) particles.push(new Particle());

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function showFloatingHearts() {
            const floatingHeartsContainer = document.getElementById('floatingHearts');
            floatingHeartsContainer.style.display = 'block';
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                floatingHeartsContainer.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 200);
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
