<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Wrapped: Sarah</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-dark-grey: #181818;
            --spotify-light-grey: #b3b3b3;
        }

        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* --- ENTRANCE ANIMATIONS --- */
        @keyframes containerFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popScale {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- STYLES --- */
        .container {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(180deg, #222222 0%, var(--spotify-black) 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
            /* Entrance */
            animation: containerFade 0.8s ease-out forwards;
        }

        .verified {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #4CB3FF;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            /* Entrance */
            opacity: 0;
            animation: slideDown 0.6s ease-out 0.4s forwards;
        }

        .artist-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            /* Entrance */
            opacity: 0;
            animation: popScale 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards;
        }

        .artist-img {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h1 {
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -1.5px;
            margin-bottom: 5px;
            /* Entrance */
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
        }

        .sub-text {
            color: var(--spotify-light-grey);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 30px;
            /* Entrance */
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.9s forwards;
        }

        .stats {
            background: var(--spotify-dark-grey);
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
            /* Entrance */
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 1.1s forwards;
        }

        .stat-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--spotify-light-grey); margin-bottom: 4px; }
        .stat-value { color: var(--spotify-green); font-weight: 900; font-size: 1.2rem; margin-bottom: 15px; }

        .play-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 16px 45px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: all 0.2s ease;
            margin-bottom: 80px;
            /* Entrance */
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 1.3s forwards;
        }

        .play-btn:hover { background-color: #1ed760; transform: scale(1.04); }

        .player-bar {
            position: absolute;
            bottom: 15px; left: 15px; right: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #282828;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
            pointer-events: none;
            /* Entrance */
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 1.5s forwards;
        }

        .mini-thumb { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; }
        .track-info p { font-size: 0.7rem; font-weight: 700; }
        .track-info span { font-size: 0.6rem; color: var(--spotify-light-grey); }

        /* SUCCESS SCREEN */
        #success-screen { display: none; text-align: center; }
        .gift-emoji {
            font-size: 5rem;
            margin-top: 30px;
            display: inline-block;
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 10px var(--spotify-green)); } }
    </style>
</head>
<body>

    <div class="container" id="main-view">
        <div class="verified">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zM10 17l-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8l-9 9z"/></svg>
            TOP ARTIST 2024
        </div>

        <div class="artist-container">
            <img src="https://i.pinimg.com/170x/e6/eb/f8/e6ebf8523bcf52b8d1554fe90466c6ed.jpg" class="artist-img">
        </div>

        <h1>Sarah</h1>
        <p class="sub-text">Captured my heart this year.</p>

        <div class="stats">
            <p class="stat-label">Total Minutes Together</p>
            <p class="stat-value">2 Years Together</p>
            <p class="stat-label">Your Most Played Memory</p>
            <p class="stat-value">That Night in Paris</p>
        </div>

        <button class="play-btn" onclick="celebrate()">Show Our Wrapped</button>

        <div class="player-bar">
            <img src="https://i.pinimg.com/170x/e6/eb/f8/e6ebf8523bcf52b8d1554fe90466c6ed.jpg" class="mini-thumb">
            <div class="track-info">
                <p>That Night in Paris</p>
                <span>Sarah</span>
            </div>
            <div style="margin-left: auto; color: var(--spotify-green);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 6v12l10-6z"/></svg>
            </div>
        </div>
    </div>

    <div id="success-screen">
        <h1 style="color: var(--spotify-green); font-size: 3rem; font-weight: 900;">Verified.</h1>
        <p style="margin-top: 20px; font-size: 1.2rem;">You are my #1 listener and my #1 person. 💚</p>
        <div class="gift-emoji">🎁</div>
    </div>

    <script>
        function celebrate() {
            confetti({ particleCount: 80, spread: 70, origin: { x: 0, y: 0.8 }, colors: ['#1DB954', '#ffffff'] });
            confetti({ particleCount: 80, spread: 70, origin: { x: 1, y: 0.8 }, colors: ['#1DB954', '#ffffff'] });

            const mainView = document.getElementById('main-view');
            const successView = document.getElementById('success-screen');
            
            mainView.style.transition = 'opacity 0.4s ease';
            mainView.style.opacity = '0';
            
            setTimeout(() => {
                mainView.style.display = 'none';
                successView.style.display = 'block';
            }, 400);
        }
    </script>
</body>
</html>
